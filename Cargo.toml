[workspace]
resolver = "3"
members = ["crates/disk", "crates/image", "crates/order", "crates/recovery",
    "crates/control-plane"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
repository = "https://github.com/zakinko/sarachi"

[workspace.dependencies]
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
