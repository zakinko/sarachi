# cgd (NetBSD) と softraid crypto (OpenBSD) の性質を実機で確かめる下調べ。
# 実装の前に知りたいことがあるので先に見る。答えが出たら消す。
name: bsd-crypt-probe

on:
  workflow_dispatch:

jobs:
  netbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/netbsd-vm@v1
        with:
          release: '11.0'
          usesh: true
          run: sh ci/bsd-crypt-probe.sh

  openbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/openbsd-vm@v1
        with:
          release: '7.9'
          usesh: true
          run: sh ci/bsd-crypt-probe.sh
