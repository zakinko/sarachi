# 高い側。vmactions は起動と導入で八分から十二分かかるので、
# 既定 branch への push と、手動と、週一の定期だけに絞る。
# PR の push ごとには回さない。
#
# OS ごとに job を分けているのは、どの BSD で落ちたかが要るため。
# shell の loop に畳むと、一つ落ちた時点で残りが分からなくなる。
# GhostBSD は FreeBSD 派生で得られる情報が重なるので、今は入れていない。
name: bsd

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      # 当て物そのものだけ。patches/** にすると README を直しただけで
      # 四十分の実行が起きる。実際に一度そうなった。
      - 'patches/*.diff'
      - 'ci/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/bsd.yml'
  workflow_dispatch:
  # 上流の crate と OS の package が動くので、こちらが何も変えなくても壊れる。
  # 壊れたことを次に触る人が踏むのが一番まずいので、週に一度は回す。
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # OpenBSD が本命。base が LibreSSL 4.3.0 で、openssl-sys 0.9.117 の
  # 対応上端にちょうど載っている。ここが通るかは cross では分からない。
  openbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/openbsd-vm@v1
        with:
          release: '7.9'
          usesh: true
          prepare: pkg_add -I rust
          run: |
            set -e
            rustc --version
            openssl version || true
            cargo test --workspace
            sh ci/libkrimes-check.sh

  netbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/netbsd-vm@v1
        with:
          release: '11.0'
          usesh: true
          prepare: /usr/sbin/pkg_add rust
          run: |
            set -e
            rustc --version
            cargo test --workspace
            sh ci/libkrimes-check.sh

  # FreeBSD は geli の実機でもある。暗号層の破壊的な試験をここで走らせる。
  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          release: '15.1'
          usesh: true
          prepare: pkg install -y rust
          run: |
            set -e
            rustc --version
            cargo test --workspace
            sh ci/libkrimes-check.sh
            # 鍵を破棄した後に開けてしまう退行が入っても、他の試験は全て
            # 通ったままになる。消去は目で見て分からないので、ここで守る。
            sh ci/crypt-real.sh

  # DragonFly だけ、配布の rust を使わない。DPorts が配るのは 1.85.1 で
  # 2025-04-05 から動いておらず、本体が使う is_multiple_of (1.87 以降) が
  # 通らない。自前で建てた 1.88 を置き場から取る。
  #
  # 以前ここは libkrimes の当て物だけを見ていた。本体を試験していなかった
  # ので、DragonFly で動くかどうかが分からないままだった。それが塞げる。
  dragonfly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/dragonflybsd-vm@v1
        with:
          release: '6.4.2'
          usesh: true
          # rust は入れない（置き場から取る）。bash は rustc の install.sh が
          # #!/usr/bin/env bash で始まるので要る。libssh2 は挙げない。既に
          # 入っているうえ、挙げると pkg が upgrade を試みて他を巻き添えに
          # 消す。
          prepare: pkg install -y bash curl
          run: |
            set -e
            sh ci/dragonfly-toolchain.sh
            cargo test --workspace
            sh ci/libkrimes-check.sh
