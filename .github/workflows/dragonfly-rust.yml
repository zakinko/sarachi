# DragonFly 向けの rustc を建てて、次から取ってくるだけで済むようにする。
#
# なぜ自分で建てるのか。Entra 認証に要る libhimmelblau は rustc 1.88 を要るが、
# DPorts が配るのは 1.85.1 で 2025-04-05 から動いていない。DPorts の
# Makefile.DragonFly が bootstrap の取得元に指している leaf.dragonflybsd.org も
# 1.84.1 が最後で、そこも同じ時期に止まっている。tier 3 なので rust 本家は
# binary を出さない。新しいものは上流のどこにも無い。
#
# 1.88 で足りることは測った。1.87 では scraper 0.27.0 の let-chains が通らず、
# 1.88 で libhimmelblau が建った。rustc は一つ前の版でしか建たないので、
# 配布されている 1.85.1 を種に 1.86 1.87 1.88 と三段積む。一段ごとに一回
# 起動する。version と bootstrap を入力で受けるのはそのため。
#
# LLVM は package から入れる。同梱のものを建てると 4 core では二時間以上
# かかり、job の上限六時間に rustc 本体と合わせて収まらない。base の cc が
# gcc 8.3 (2019) なのも効く。DPorts は llvm19 と llvm20 の binary を配って
# いるので、llvm-config をそちらへ向ける。
#
# 器は測ってある (2026-09-21)。/ に 134G、swap 16G、4 core、memory 6.4G。
# disk は問題にならない。
name: dragonfly-rust

on:
  workflow_dispatch:
    inputs:
      version:
        description: '建てる rustc の版 (例 1.86.0)'
        required: true
      llvm:
        description: >
          使う LLVM の package 名。空なら版から決める（そちらが正しい）。
          表に無い版を試すときだけ渡す
        required: false
        default: ''
      bootstrap_run_id:
        description: >
          種にする rustc を出した、この workflow の前の run の id。
          空なら pkg の rust (1.85.1) を使う
        required: false
        default: ''
      bootstrap_version:
        description: '種の版。bootstrap_run_id を渡すときだけ要る (例 1.86.0)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 六時間の上限に当たって何も残らないより、手前で切って log を残したい
    timeout-minutes: 345
    # 前の段の artifact を別の run から降ろすのに要る。
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      # 段を繋ぐ間は artifact で受け渡す。三段そろうまで外へ出さない。
      - name: 前の段の rustc を降ろす
        if: inputs.bootstrap_run_id != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.bootstrap_run_id }}
          github-token: ${{ github.token }}
          path: bootstrap
          merge-multiple: true

      - uses: vmactions/dragonflybsd-vm@v1
        with:
          release: '6.4.2'
          usesh: true
          # 一段目の種になる pkg の rust (1.85.1)。二段目からは前の段の
          # artifact を使うので要らないが、入れておいても害は無く、
          # prepare に条件分岐を持ち込まずに済む。
          #
          # LLVM はここで入れない。版によって変わるうえ、合わない版が
          # 置いてあると lld の build step が CMake の find_package で
          # そちらを拾う。build script が版を決めてから、合う物だけを入れる。
          # bash は rust の install.sh のために要る。あれは
          # #!/usr/bin/env bash で始まるが DragonFly の base に bash は無い。
          # 二段目以降で種を入れるときだけ効き、一段目は pkg の rust を
          # 使うので install.sh を呼ばず、そこでは表に出なかった。
          prepare: pkg install -y rust bash cmake ninja git python3 curl pkgconf
          run: |
            set -e
            # 種の置き場は shell で組み立てる。式の中で引用を入れ子にすると
            # YAML と shell の両方に読まれて崩れる。
            BOOTSRC=''
            if [ -n '${{ inputs.bootstrap_version }}' ]; then
              BOOTSRC=bootstrap
            fi
            sh ci/dragonfly-rust-build.sh \
              '${{ inputs.version }}' \
              '${{ inputs.llvm }}' \
              "$BOOTSRC" \
              '${{ inputs.bootstrap_version }}'

      - name: 成果物を持ち帰る
        uses: actions/upload-artifact@v4
        with:
          name: rust-${{ inputs.version }}-x86_64-unknown-dragonfly
          path: dist/*.tar.xz
          if-no-files-found: error
          # 次の段の種になるまで持てばよい
          retention-days: 30
