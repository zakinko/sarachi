# DragonFly の暗号層が何なのかを実機で確かめる、使い捨ての下調べ。
#
# crypt.rs は今 DragonFly を RootKind::FreeBsdZfs / FreeBsdUfs 経由で Geli に
# 落としている。しかし DragonFly は geli ではなく dm_target_crypt（LUKS 互換）を
# 持つという情報があり、本当なら Luks を通すのが正しい。どちらかで実装が変わる。
#
# 答えが出たら、この workflow は消す。
name: dragonfly-crypt-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/dragonflybsd-vm@v1
        with:
          release: '6.4.2'
          usesh: true
          run: |
            echo "=== geli はあるか ==="
            ls -l /sbin/geli 2>/dev/null || echo "  無い"
            echo
            echo "=== cryptsetup はあるか ==="
            for p in /sbin/cryptsetup /usr/local/sbin/cryptsetup /usr/sbin/cryptsetup; do
              [ -x "$p" ] && echo "  $p"
            done
            pkg search -x '^cryptsetup' 2>/dev/null | head -5 || echo "  package にも無い"
            echo
            echo "=== dm と dm_target_crypt ==="
            ls -l /sbin/dmsetup /usr/sbin/dmsetup 2>/dev/null || echo "  dmsetup 無し"
            kldstat 2>/dev/null | grep -i dm || echo "  dm module 未読み込み"
            kldload dm 2>&1 | head -2
            kldload dm_target_crypt 2>&1 | head -2
            kldstat 2>/dev/null | grep -i dm || echo "  読み込め なかった"
            echo
            echo "=== kernel に何が組み込まれているか ==="
            sysctl -a 2>/dev/null | grep -iE 'dm_target|geli|crypto' | head -10
            echo
            echo "=== /boot/kernel に在る module ==="
            ls /boot/kernel 2>/dev/null | grep -iE 'dm|crypt|geli' | head -20
