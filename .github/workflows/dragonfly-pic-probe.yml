# -fPIC が付かない件を測って突き止める。理屈では「付くはず」にしかならない
# ので、実際に叩かれた command line と object を見る。
# 原因が分かったら消す。
name: dragonfly-pic-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      # bootstrap は dragonfly 向けに足す cflags が無いので、値は空になる。
      SARACHI_SET_CFLAGS: '1'
      SARACHI_EMPTY_OK: ''
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/dragonflybsd-vm@v1
        with:
          release: '6.4.2'
          usesh: true
          # 建てた 1.88 ではなく pkg の rust を使う。落ちたときの報告先が
          # 我々の作った物だと、話がややこしくなる。
          prepare: pkg install -y rust binutils
          envs: 'SARACHI_SET_CFLAGS SARACHI_EMPTY_OK'
          run: sh ci/dragonfly-pic-probe.sh

      - name: log を持ち帰る
        uses: actions/upload-artifact@v4
        with:
          name: pic-probe
          path: probe-out/
          if-no-files-found: warn
